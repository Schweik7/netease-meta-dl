[project]
name = "nmdl"
version = "0.1.0"
description = "批量为本地音乐下载网易云歌词与封面（CLI + GUI）"
readme = "README.md"
authors = [
    { name = "Schweik7", email = "weibidewo0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.48.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
gui = [
    "gooey>=1.0.8.1",
    "six>=1.16.0",   # Gooey 1.0.8.1 漏声明了这个依赖
]

[project.scripts]
nmdl = "nmdl.cli:main"

[project.gui-scripts]
nmdl-gui = "nmdl.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
